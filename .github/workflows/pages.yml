name: Deploy SQCAD case study

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'case_study/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check browser scripts
        run: |
          node --check case_study/app.js
          node --check case_study/future-view.js
          node --test case_study/tests/future-model.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        shell: bash
        run: |
          mkdir -p _site/case_study/assets _site/case_study/docs
          cp index.html _site/index.html
          cp case_study/index.html case_study/app.js case_study/future-model.js case_study/future-view.js case_study/styles.css _site/case_study/
          cp case_study/assets/*.webp _site/case_study/assets/
          # Keep the old URL as a redirect to the repository documentation.
          cp case_study/docs/guide.html _site/case_study/docs/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
